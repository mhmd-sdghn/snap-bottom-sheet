name: Docs

on:
  push:
    branches: [main]
    # The site imports the built library, so a library change can change the
    # docs build too.
    paths:
      - "docs/**"
      - "packages/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Least privilege: the build only reads the repository. `pages: write` is
    # for configure-pages, which reads and updates the Pages settings.
    permissions:
      contents: read
      pages: write
    steps:
      # Pinned to commits; see the note in ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # docs depend on `snap-bottom-sheet` as workspace:*, which resolves
      # through its exports to dist/ — so the library has to exist first.
      - name: Build library
        run: pnpm build

      - name: Build docs
        run: pnpm docs:build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The deployment itself: it publishes the artifact and exchanges an OIDC
    # token for it. It never touches the repository contents.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
