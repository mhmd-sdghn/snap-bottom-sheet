name: Docs

on:
  push:
    branches: [main]
    # The site imports the built library, so a library change can change the
    # docs build too.
    paths:
      - "docs/**"
      - "packages/**"
      - "playgrounds/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Least privilege: the build only reads the repository. `pages: write` is
    # for configure-pages, which reads and updates the Pages settings.
    permissions:
      contents: read
      pages: write
    steps:
      # Pinned to commits; see the note in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # docs and the playground depend on `snap-bottom-sheet` as workspace:*,
      # which resolves through its exports to dist/ — so the library has to
      # exist first.
      - name: Build library
        run: pnpm build

      # Docs, plus the React playground into dist/playground/, so both ship in
      # one Pages artifact. Same script locally: `pnpm site:build`.
      - name: Build site
        run: pnpm site:build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # v4 of this one stopped including dotfiles in the artifact. VitePress
      # emits none, so the default stays.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The deployment itself: it publishes the artifact and exchanges an OIDC
    # token for it. It never touches the repository contents.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
