name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# Nothing at workflow level: only the release job needs write access, and a
# job that is added later should have to ask for it.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release PR and its tags
      pull-requests: write # the release PR itself
      id-token: write # npm provenance / trusted publishing
    steps:
      # Pinned to commits; see the note in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publishing runs through `pnpm publish` (see the `release` script), and
      # the pnpm version comes from `packageManager` in the root package.json.
      # It has to be recent enough for OIDC trusted publishing: pnpm >= 10.13.
      # v2 of this action goes with @changesets/cli v3, and renamed its inputs:
      # publish -> publish-script, commit -> commit-message, title -> pr-title.
      # It also stopped reading GITHUB_TOKEN from the environment — the token
      # is the `github-token` input now, and its default is `${{ github.token }}`,
      # which is exactly what we were passing, so it is left unset.
      - name: Create release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          # No NPM_TOKEN: publishing authenticates via OIDC trusted publishing
          # (see `permissions: id-token: write` above). A token here would make
          # pnpm use token auth instead of the OIDC exchange.
          NPM_CONFIG_PROVENANCE: "true"
