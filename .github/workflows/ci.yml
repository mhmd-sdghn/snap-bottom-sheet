name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit, not a tag: a tag can be
      # moved. Dependabot (.github/dependabot.yml) raises the bumps.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check dist shape (NODE_ENV guard, "use client", dts maps)
        run: pnpm --filter snap-bottom-sheet check:dist

      - name: Validate package (publint + arethetypeswrong)
        run: pnpm verify:pkg

      - name: Bundle size budget
        run: pnpm --filter snap-bottom-sheet size

      # The site imports the built library and typechecks its demos, so a
      # library change can break it. Deploying it is docs.yml's job; this is
      # only the check, and it runs on pull requests too.
      - name: Build docs
        run: pnpm docs:build

      - name: Build playgrounds (consume dist through workspace:*)
        run: |
          pnpm --filter playground-vanilla build
          pnpm --filter playground-react build
          pnpm --filter playground-next build
