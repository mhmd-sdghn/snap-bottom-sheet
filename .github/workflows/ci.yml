name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate package (publint + arethetypeswrong)
        run: pnpm verify:pkg

      - name: Bundle size budget
        run: pnpm --filter snap-bottom-sheet size

      - name: Build playgrounds (consume dist through workspace:*)
        run: |
          pnpm --filter playground-vanilla build
          pnpm --filter playground-react build
          pnpm --filter playground-next build
