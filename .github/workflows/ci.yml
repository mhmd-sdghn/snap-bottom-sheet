name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit, not a tag: a tag can be
      # moved. Dependabot (.github/dependabot.yml) raises the bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # v6 stopped auto-detecting the cache for anything but npm, so `cache:
      # pnpm` stays explicit. It reads the store path from the pnpm that
      # action-setup put on PATH, hence the order.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      # Before the typecheck: the docs resolve `snap-bottom-sheet` through its
      # exports to dist/, so `tsc --noEmit` there has nothing to read until the
      # library is built.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check dist shape (NODE_ENV guard, "use client", dts maps)
        run: pnpm --filter snap-bottom-sheet check:dist

      - name: Validate package (publint + arethetypeswrong)
        run: pnpm verify:pkg

      - name: Bundle size budget
        run: pnpm --filter snap-bottom-sheet size

      # The site imports the built library and typechecks its demos, so a
      # library change can break it. Deploying it is docs.yml's job; this is
      # only the check, and it runs on pull requests too.
      - name: Build docs
        run: pnpm docs:build

      - name: Build playgrounds (consume dist through workspace:*)
        run: |
          pnpm --filter playground-vanilla build
          pnpm --filter playground-react build
          pnpm --filter playground-next build
